name: Supabase Keepalive

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Query FossilFinder database
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/dinosaurs?select=*&limit=1" \
            -H "apikey: &{{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            > /dev/null
